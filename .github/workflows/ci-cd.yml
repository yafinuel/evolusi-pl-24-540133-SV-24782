name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build & Install Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-suggest

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-suggest

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy to Staging
        run: echo "Deploying to staging environment..."
  
  production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: staging
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Eksekusi 7 Langkah Deployment (Echo)
        run: |
          echo "Langkah 1: php artisan down --retry=60"
          echo "Langkah 2: git pull origin main"
          echo "Langkah 3: composer install --no-dev --optimize-autoloader"
          echo "Langkah 4: php artisan migrate --force"
          echo "Langkah 5: php artisan config:cache && php artisan route:cache && php artisan view:cache"
          echo "Langkah 6: php artisan queue:restart"
          echo "Langkah 7: php artisan up"
